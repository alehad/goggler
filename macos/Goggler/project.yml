name: Goggler
options:
  bundleIdPrefix: com.goggler
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Goggler:
    type: application
    platform: macOS
    sources:
      - path: Goggler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goggler.Goggler
        PRODUCT_NAME: Goggler
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Goggler/Goggler.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated-Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.shopping
  GogglerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GogglerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goggler.GogglerTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Goggler
schemes:
  Goggler:
    build:
      targets:
        Goggler: all
        GogglerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GogglerTests
